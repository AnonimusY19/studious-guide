<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano inclinato e attrito</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Import map: Three.js + cannon-es da CDN -->
  <script type="importmap">
  {
    "imports": {
      "three":              "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/":      "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
      "cannon-es":          "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>

<body>

  <div class="wrap">

    <!-- Il canvas è ora gestito da Three.js -->
    <canvas id="sim-canvas"></canvas>

    <!-- ========================= -->
    <!-- AMBIENTE -->
    <!-- ========================= -->

    <div class="env-bar">
      <span>Ambiente</span>
      <span>-</span>
      <span>Gravità:</span>

      <input
        type="range"
        id="g-slider"
        min="1" max="25" value="9.81" step="0.01"
        style="width:90px"
        oninput="onGravSlider()">

      <input
        type="number"
        id="g-num"
        class="prop-num"
        value="9.81" min="1" max="25" step="0.01"
        onchange="onGravNumber()">

      <span class="prop-unit">m/s<sup>2</sup></span>
    </div>

    <!-- ========================= -->
    <!-- PANNELLO PIANO -->
    <!-- ========================= -->

    <div class="panel" id="panel-plane">
      <div class="panel-header">
        <span class="panel-title">Piano inclinato</span>
        <button class="panel-close" onclick="closePanelBtn('plane')">Chiudi ×</button>
      </div>

      <div class="prop-grid">

        <div class="prop-group">
          <div class="prop-label">Angolo (θ)</div>
          <div class="slider-row">
            <input type="range" id="angle-slider" min="0" max="75" value="30" step="1" oninput="onAngleSlider()">
          </div>
          <div class="num-row">
            <input type="number" id="angle-num" class="prop-num" value="30" min="0" max="75" step="1" onchange="onAngleNumber()">
            <span class="prop-unit">°</span>
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-label">Coeff. attrito (μ)</div>
          <div class="slider-row">
            <input type="range" id="mu-slider" min="0" max="1" value="0.30" step="0.01" oninput="onMuSlider()">
          </div>
          <div class="num-row">
            <input type="number" id="mu-num" class="prop-num" value="0.30" min="0" max="1" step="0.01" onchange="onMuNumber()">
          </div>
        </div>

      </div>
    </div>

    <!-- ========================= -->
    <!-- PANNELLO OGGETTO -->
    <!-- ========================= -->

    <div class="panel" id="panel-obj">
      <div class="panel-header">
        <span class="panel-title">Oggetto</span>
        <button class="panel-close" onclick="closePanelBtn('obj')">Chiudi ×</button>
      </div>

      <div class="prop-grid">

        <div class="prop-group">
          <div class="prop-label">Massa (kg)</div>
          <div class="slider-row">
            <input type="range" id="mass-slider" min="0.1" max="100" value="5" step="0.1" oninput="onMassSlider()">
          </div>
          <div class="num-row">
            <input type="number" id="mass-num" class="prop-num" value="5.00" min="0.1" max="100" step="0.1" onchange="onMassNumber()">
            <span class="prop-unit">kg</span>
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-label">Forma</div>
          <div class="shape-btns" style="margin-top:4px">
            <button class="shape-btn active" onclick="setShape('cube',this)">Cubo</button>
            <button class="shape-btn" onclick="setShape('sphere',this)">Sfera</button>
            <button class="shape-btn" onclick="setShape('cylinder',this)">Cilindro</button>
          </div>
        </div>

      </div>

      <!-- FORZE -->
      <div class="forces-section">
        <div class="forces-title">Forze in gioco</div>

        <div class="force-row">
          <div class="force-dot" style="background:#E24B4A"></div>
          <span class="force-name">Peso (Fg)</span>
          <span class="force-val" id="f-fg">—</span>
          <div class="force-bar-wrap"><div class="force-bar" id="b-fg" style="background:#E24B4A"></div></div>
        </div>

        <div class="force-row">
          <div class="force-dot" style="background:#378ADD"></div>
          <span class="force-name">Normale (N)</span>
          <span class="force-val" id="f-fn">—</span>
          <div class="force-bar-wrap"><div class="force-bar" id="b-fn" style="background:#378ADD"></div></div>
        </div>

        <div class="force-row">
          <div class="force-dot" style="background:#1D9E75"></div>
          <span class="force-name">Attrito (Ff)</span>
          <span class="force-val" id="f-ff">—</span>
          <div class="force-bar-wrap"><div class="force-bar" id="b-ff" style="background:#1D9E75"></div></div>
        </div>

        <div class="force-row">
          <div class="force-dot" style="background:#EF9F27"></div>
          <span class="force-name">Risultante (Fr)</span>
          <span class="force-val" id="f-fr">—</span>
          <div class="force-bar-wrap"><div class="force-bar" id="b-fr" style="background:#EF9F27"></div></div>
        </div>

        <div class="status-line">
          <span style="font-size:12px;color:var(--color-text-secondary)">Stato:</span>
          <span class="badge" id="status-badge">—</span>
        </div>
      </div>

    </div>

    <p class="hint" id="hint-text">
      Clicca sul piano o sull'oggetto per vederne le proprietà
    </p>

  </div>

  <script type="module" src="js/main.js"></script>

</body>
</html>
